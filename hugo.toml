baseURL = 'https://quisora.dev/'
locale = 'en-US'
title = 'Quisora'

# `tags` frontmatter is metadata only; do not generate taxonomy/term list pages for it.
disableKinds = ['taxonomy', 'term']

[outputs]
  home = ['HTML', 'JSON']

[params]
  githubURL = "https://github.com/paularlott/quisora"
  copyright = "Paul Arlott"
  defaultTheme = "light"  # Options: "light" or "dark"
  includeSections = ["docs"]

  [params.navigation]
    [[params.navigation.header]]
      name = 'Home'
      url = '/'
    [[params.navigation.header]]
      name = 'Docs'
      url = '/docs/'
    [[params.navigation.header]]
      name = 'Get started'
      url = '/docs/getting-started/'

# The css.TailwindCSS transform executes the tailwindcss binary, which is not
# in Hugo's default security.exec allowlist.
[security]
  [security.exec]
    allow = ['^(dart-)?sass$', '^go$', '^git$', '^node$', '^postcss$', '^tailwindcss$']

[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = 'assets/notwatching/hugo_stats\.json'
    target = 'css'
  [[build.cachebusters]]
    source = '(postcss|tailwind)\.config\.js'
    target = 'css'

[module]
  [module.hugoVersion]
    extended = true
    min = '0.150.0'

  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

  [markup.highlight]
    noClasses = false
    lineNoStart = 1
    lineNos = false
    lineNumbersInTable = false
    tabWidth = 2

  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    disableWatch = true
    source = 'hugo_stats.json'
    target = 'assets/notwatching/hugo_stats.json'

# Keep "--" and "---" as typed (command line flags in prose), so no dashes are made up.
[markup.goldmark.extensions.typographer]
  enDash = '--'
  emDash = '---'
