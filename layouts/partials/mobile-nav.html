<div id="mobile-menu-overlay" class="fixed inset-0 z-60 lg:hidden hidden">
  <div id="mobile-menu-backdrop" class="fixed inset-0 bg-[var(--scrim)] transition-all duration-300 ease-out opacity-0"></div>
  <div id="mobile-menu-sidebar" class="glass-panel !rounded-l-none fixed top-0 left-0 h-full w-80 max-w-[85vw] transform -translate-x-full transition-all duration-300 ease-out">
    <div class="flex flex-col h-full">
      <div class="flex items-center justify-between p-3 pl-4">
        <span class="font-bold">Menu</span>
        <button id="mobile-menu-close" class="icon-btn" aria-label="Close navigation menu">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="flex-1 overflow-y-auto px-3 pb-6 hide-scrollbar">
        <nav aria-label="Docs">
          {{ partial "navigation.html" (dict "mobile" true "context" .) }}
        </nav>
      </div>
    </div>
  </div>
</div>
